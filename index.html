<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>BPL Branch & Council Map</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.1.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.min.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.7.2/mapbox-gl-geocoder.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .mapboxgl-popup-content {
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        .mapboxgl-ctrl-geocoder {
            min-width: 300px;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoiYWFyb25pbmJyb29rbHluIiwiYSI6ImNtOGowMmZ0dzBjMDgycnB4eWdhZW9nZ2sifQ.Z70awiKsIraT8Mfh-T_iAg';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/aaroninbrooklyn/cm9ha0sz800k101qk0pi7amse',
        center: [-73.9266, 40.6343],
        zoom: 11.7
    });

    // Add search bar
    map.addControl(new MapboxGeocoder({
        accessToken: mapboxgl.accessToken,
        mapboxgl: mapboxgl,
        placeholder: 'Search your address',
        marker: false
    }), 'top-left');

    const popup = new mapboxgl.Popup({
        closeButton: false,
        closeOnClick: false
    });

    map.on('load', () => {
        // Hover info for BPL branches
        map.on('mousemove', 'bplbranchesmap-cepkea', (e) => {
            const props = e.features[0].properties;

            const popupHtml = `
                <strong>Branch:</strong> ${props["branch"] || "N/A"}<br/>
                <strong>Address:</strong> ${props["address"] || "N/A"}<br/>
                <strong>Phone:</strong> ${props["phone"] || "N/A"}<br/>
                <strong>Amenities:</strong> ${props["Amenities"] || "N/A"}<br/>
                <strong>Bus:</strong> ${props["bus"] || "N/A"}<br/>
                <strong>Subway:</strong> ${props["subway"] || "N/A"}<br/>
                <strong>Hours:</strong><br/>
                Mon: ${props["Monday"] || "N/A"}<br/>
                Tue: ${props["Tuesday"] || "N/A"}<br/>
                Wed: ${props["Wednesday"] || "N/A"}<br/>
                Thu: ${props["Thursday"] || "N/A"}<br/>
                Fri: ${props["Friday"] || "N/A"}<br/>
                Sat: ${props["Saturday"] || "N/A"}<br/>
                Sun: ${props["Sunday"] || "N/A"}<br/>
                <strong>Council District:</strong> ${props["CouncilDistrict"] || "N/A"}<br/>
                <strong>Council Member:</strong> ${props["Council Member Name"] || "N/A"}<br/>
                <strong>District Office:</strong> ${props["District Office Address"] || "N/A"}<br/>
                <strong>District Phone:</strong> ${props["District Office Phone"] || "N/A"}<br/>
            `;

            popup.setLngLat(e.lngLat).setHTML(popupHtml).addTo(map);
        });

        map.on('mouseleave', 'bplbranchesmap-cepkea', () => {
            popup.remove();
        });

        // Click on geocoder result to get district info
        map.on('click', (e) => {
            const features = map.queryRenderedFeatures(e.point, {
                layers: ['nyc-council-districts-bwhh6h']
            });

            if (features.length) {
                const props = features[0].properties;
                new mapboxgl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <strong>Council District:</strong> ${props["coun_dist"] || "N/A"}<br/>
                        <strong>Council Member:</strong> ${props["Council Member Name"] || "N/A"}<br/>
                        <strong>District Office:</strong> ${props["District Office Address"] || "N/A"}<br/>
                        <strong>District Phone:</strong> ${props["District Office Phone"] || "N/A"}
                    `)
                    .addTo(map);
            }
        });
    });
</script>
</body>
</html>
